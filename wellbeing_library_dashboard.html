let currentBookId = 'flourish';
let currentSearchTerm = '';

function renderSidebar() {
    const navContainer = document.getElementById('bookListNav');
    navContainer.innerHTML = '';

    const pillars = [
        { name: "Joy", color: "text-amber-600 dark:text-amber-400" },
        { name: "Growth", color: "text-emerald-600 dark:text-emerald-400" },
        { name: "Connection", color: "text-blue-600 dark:text-blue-400" },
        { name: "Purpose", color: "text-purple-600 dark:text-purple-400" },
        { name: "Contribution", color: "text-rose-600 dark:text-rose-400" },
        { name: "Physical Fitness", color: "text-teal-600 dark:text-teal-400" },
        { name: "Mental Wellbeing", color: "text-indigo-600 dark:text-indigo-400" },
        { name: "Healthy Eating", color: "text-lime-600 dark:text-lime-400" }
    ];

    let matchCount = 0;

    pillars.forEach(p => {
        const booksInPillar = Object.values(BOOKS).filter(b => {
            const matchesPillar = b.pillar === p.name;
            const matchesSearch = currentSearchTerm === '' || 
                b.title.toLowerCase().includes(currentSearchTerm) || 
                b.author.toLowerCase().includes(currentSearchTerm) ||
                b.tag.toLowerCase().includes(currentSearchTerm);
            return matchesPillar && matchesSearch;
        });

        if (booksInPillar.length > 0) {
            matchCount += booksInPillar.length;

            const pillarHeader = document.createElement('div');
            pillarHeader.className = "pt-2 first:pt-0";
            pillarHeader.innerHTML = `<h3 class="text-xs font-bold ${p.color} uppercase tracking-wider mb-2 flex items-center gap-1.5">
                <span>${booksInPillar[0].pillarIcon}</span> ${p.name}
            </h3>`;
            navContainer.appendChild(pillarHeader);

            booksInPillar.forEach(book => {
                const btn = document.createElement('button');
                const isSelected = book.id === currentBookId;
                btn.onclick = () => selectBook(book.id);
                btn.className = `w-full text-left p-2.5 rounded-xl transition-all duration-150 flex items-center justify-between ${
                    isSelected 
                    ? 'bg-brand-red text-white font-medium shadow-sm' 
                    : 'hover:bg-brand-sand/60 dark:hover:bg-stone-800 text-stone-700 dark:text-stone-300'
                }`;
                btn.innerHTML = `
                    <div class="truncate pr-2">
                        <div class="text-xs font-bold truncate">${book.title}</div>
                        <div class="text-[11px] opacity-80 truncate">${book.author}</div>
                    </div>
                    ${isSelected ? '<span class="text-xs">➔</span>' : ''}
                `;
                navContainer.appendChild(btn);
            });
        }
    });

    document.getElementById('bookCountBadge').textContent = `${matchCount} Books`;
}

function selectBook(bookId) {
    if (!BOOKS[bookId]) return;
    currentBookId = bookId;
    renderSidebar();
    renderBookDetail();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

            '<p class="text-sm text-stone-600 leading-relaxed">' + ch.summary + '</p>' +
        '</div>'

'    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">\n' +
'    <style>\n' +
'        body { font-family: "Inter", sans-serif; background-color: #FAF7F2; color: #332F2C; }\n' +
'        .font-serif { font-family: "Lora", serif; }\n' +
'        .font-title { font-family: "Cinzel", serif; }\n' +
'    </style>\n' +
'</head>\n' +
'<body class="py-12 px-4 sm:px-6 lg:px-8 max-w-4xl mx-auto">\n' +
'    <div class="bg-white p-8 sm:p-12 rounded-2xl border border-stone-200 shadow-sm">\n' +
'        <div class="mb-8 pb-6 border-b border-stone-200">\n' +
'            <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-stone-100 text-red-600 mb-3">\n' +

'                ' + book.overview + '\n' +

'</html>';

    const blob = new Blob([htmlContent], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${book.title.toLowerCase().replace(/[^a-z0-9]/g, '_')}_summary.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

function filterBooks() {
    currentSearchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
    renderSidebar();
}

function toggleDarkMode() {
    document.documentElement.classList.toggle('dark');
    const isDark = document.documentElement.classList.contains('dark');
    document.getElementById('sunIcon').classList.toggle('hidden', !isDark);
    document.getElementById('moonIcon').classList.toggle('hidden', isDark);
}

window.onload = function() {
    renderSidebar();
    renderBookDetail();
};
